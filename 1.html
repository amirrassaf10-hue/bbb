<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تماس تصویری - تست اتصال</title><style>body{font-family:Arial;background:#111;color:#fff;text-align:center;margin:0;padding:20px}button,input{padding:12px;margin:6px;border-radius:8px;border:0}video{width:44%;background:#000;border-radius:10px;margin:4px}.box{max-width:900px;margin:auto}.ok{color:#35d07f}.bad{color:#ff5d5d}.warn{color:#ffd166}.code{font-size:40px;font-weight:bold;letter-spacing:7px}.log{background:#1b1b1b;padding:12px;text-align:left;direction:ltr;white-space:pre-wrap;border-radius:10px;min-height:130px}</style></head><body><div class="box"><h2>تماس تصویری — نفر اول</h2><div>کد ۳ رقمی:</div><div id="code" class="code">...</div><div id="status">در حال راه‌اندازی...</div><button id="cam">فعال‌کردن دوربین</button><br><input id="remote" inputmode="numeric" maxlength="3" placeholder="کد نفر دوم"><button id="call">اتصال</button><h3>وضعیت WebRTC</h3><div id="diag" class="log">در انتظار...</div><video id="local" autoplay muted playsinline></video><video id="remoteVideo" autoplay playsinline></video></div><script src="./peerjs.min.js"></script><script>
const ICE={iceServers:[{urls:'stun:stun.relay.metered.ca:80'},{urls:'turn:global.relay.metered.ca:80',username:'862ddd91337545f849e0d691',credential:'xw2Kc2SaP7mcjPZo'},{urls:'turn:global.relay.metered.ca:80?transport=tcp',username:'862ddd91337545f849e0d691',credential:'xw2Kc2SaP7mcjPZo'},{urls:'turn:global.relay.metered.ca:443',username:'862ddd91337545f849e0d691',credential:'xw2Kc2SaP7mcjPZo'},{urls:'turns:global.relay.metered.ca:443?transport=tcp',username:'862ddd91337545f849e0d691',credential:'xw2Kc2SaP7mcjPZo'}]};
const $=id=>document.getElementById(id), log=t=>{$('diag').textContent+=('\n'+t)}, status=t=>$('status').textContent=t;let peer,stream,call;
async function camera(){if(stream)return stream;stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});$('local').srcObject=stream;status('دوربین و میکروفون آماده است.');return stream}
function setupPeer(){if(typeof Peer==='undefined'){status('PeerJS لود نشده! peerjs.min.js را کنار فایل قرار بده.');return}peer=new Peer(String(Math.floor(100+Math.random()*900)),{host:'0.peerjs.com',port:443,path:'/',secure:true,config:ICE,debug:2});peer.on('open',id=>{$('code').textContent=id;status('Signaling: OK — کد آماده است.');log('Signaling: OK | Peer ID: '+id)});peer.on('error',e=>{log('PeerJS ERROR: '+e.type+' '+(e.message||''));status('PeerJS: '+e.type)});peer.on('disconnected',()=>log('Signaling: disconnected'));peer.on('call',async c=>{call=c;await camera();wire(c);c.answer(stream)});}
function wire(c){c.on('stream',s=>{$('remoteVideo').srcObject=s;log('Media: remote stream received')});c.on('close',()=>log('Call: closed'));c.on('error',e=>log('Call ERROR: '+e.message));c.on('iceStateChange',()=>{});}
$('cam').onclick=()=>camera().catch(e=>{status('Camera error: '+e.message);log('Camera ERROR: '+e.name+' '+e.message)});
$('call').onclick=async()=>{let id=$('remote').value.trim();if(!/^\d{3}$/.test(id)){status('کد باید دقیقاً ۳ رقم باشد.');return}try{await camera();call=peer.call(id,stream);wire(call);status('ICE: checking — در حال اتصال...');log('Call started -> '+id);setTimeout(()=>inspect(),1500);setTimeout(()=>inspect(),5000);setTimeout(()=>inspect(),10000)}catch(e){log('CALL ERROR: '+e.message)}};
async function inspect(){if(!call||!call.peerConnection){log('ICE: peerConnection not available yet');return}let pc=call.peerConnection;log('ICE state: '+pc.iceConnectionState+' | Connection: '+pc.connectionState);try{let stats=await pc.getStats();let found=new Set();stats.forEach(r=>{if(r.type==='candidate-pair'&&r.state==='succeeded'){if(r.localCandidateId){let l=stats.get(r.localCandidateId);if(l)found.add('local='+l.candidateType)}if(r.remoteCandidateId){let x=stats.get(r.remoteCandidateId);if(x)found.add('remote='+x.candidateType)}}});if(found.size)log('Selected candidate pair: '+[...found].join(' | '));if([...found].some(x=>x.includes('relay')))log('TURN RELAY: SELECTED');}catch(e){log('Stats error: '+e.message)}}
setupPeer();
</script></body></html>
